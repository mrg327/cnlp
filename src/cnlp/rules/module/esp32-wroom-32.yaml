# Module rules for ESP32-WROOM-32 (3.3 V flash, no PSRAM). Draft; needs review.
module: esp32-wroom-32
chip: esp32

pin_sets:
  flash: [6, 7, 8, 9, 10, 11]
  psram_free: [16, 17]            # W2: no PSRAM, so C4 does not apply
  strapping: [0, 2, 5, 12, 15]    # W4
  mtdi: [12]                      # W3
  not_exposed: [37, 38]           # W5: bonded on the chip, not brought out by the module

rules:
  W1:
    severity: error
    message: "GPIO {gpio} ({role}): this pin is connected to the module's integrated flash. Move it. {suggest}"
  W3_EXTERNAL_PULLUP:
    id: W3
    severity: error
    message: "GPIO 12 ({role}): the flash runs at 3.3 V, so GPIO 12 must be low at reset, and an external pull-up breaks boot. Remove the pull-up, or move it. {suggest}"
  W3_RESET:
    id: W3
    severity: warning
    message: "GPIO 12 ({role}): GPIO 12 must be low at reset on this module, and whatever is attached may hold it high then. Declare 'gpio 12 is low at reset', or move it. {suggest}"
  W4:
    severity: warning
    message: "GPIO {gpio} ({role}): strapping pin, and its level at reset isn't declared. Say 'gpio {gpio} is low at reset' or 'high at reset' so the boot mode is known."
  W5:
    severity: error
    message: "GPIO {gpio} ({role}): GPIO 37 and 38 aren't brought out on the ESP32-WROOM-32 module. Move it. {suggest}"

