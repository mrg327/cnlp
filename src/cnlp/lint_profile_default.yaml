# Default lint profile for cnlp. Merged under <project>/cnlp-profile.yaml.
include_allow:
  # standard C
  - assert.h
  - complex.h
  - ctype.h
  - errno.h
  - fenv.h
  - float.h
  - inttypes.h
  - iso646.h
  - limits.h
  - locale.h
  - math.h
  - setjmp.h
  - signal.h
  - stdalign.h
  - stdarg.h
  - stdatomic.h
  - stdbool.h
  - stddef.h
  - stdint.h
  - stdio.h
  - stdlib.h
  - stdnoreturn.h
  - string.h
  - tgmath.h
  - time.h
  - uchar.h
  - wchar.h
  - wctype.h
  # ESP-IDF
  - freertos/*
  - esp_*.h
  - esp_*/*.h
  - driver/*.h
  - nvs.h
  - nvs_flash.h
  - sdkconfig.h
  # generated by cnlp
  - board_pins.h
  - board_drivers.h
include_ban:
  driver/adc.h: "use esp_adc/adc_oneshot.h (adc_oneshot API)"
  driver/adc_types_legacy.h: "use esp_adc/adc_oneshot.h (adc_oneshot API)"
  driver/i2c.h: "use driver/i2c_master.h (i2c_master API)"
  driver/timer.h: "use driver/gptimer.h (gptimer API)"
  driver/rmt.h: "use driver/rmt_tx.h / driver/rmt_rx.h"
  driver/pcnt.h: "use driver/pulse_cnt.h"
  driver/sigmadelta.h: "use driver/sdm.h"
  driver/mcpwm.h: "use driver/mcpwm_prelude.h"
  driver/i2s.h: "use driver/i2s_std.h / i2s_tdm.h / i2s_pdm.h"
  Arduino.h: "banned: Arduino is not allowed; use ESP-IDF APIs"
