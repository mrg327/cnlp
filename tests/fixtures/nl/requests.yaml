    console is on uart0.
    gpio 36 is input interrupt "switch" with external pull-up.
    gpio 39 is input adc "pot" with no pull.
  expected_rules: ["C11"]
  notes: "Known ESP32 erratum: GPIO 36/39 interrupts while any ADC is in use."

- id: rule-013
  category: rule_violation
  request: "Want an audio DAC output on GPIO 27 for a speaker. wifi bt off."
