    gpio 1 is output "led" with no pull.
  expected_rules: ["C12"]
  notes: "GPIO 1 is UART0 TX. The user asks a question; the translation is still a faithful statement and the engine raises it."

- id: rule-009
  category: rule_violation
  request: "I2C sensor on 21 and 22, I don't have any resistors, just wire it straight. No wifi or bluetooth."
  expected_spec: |
