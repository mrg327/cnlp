- id: rule-007
  category: rule_violation
  request: "Wake the board from deep sleep with a button on GPIO 5 (10k pull-up on the board, button to ground). Wifi off, bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    deep sleep is on.
    console is on uart0.
    gpio 5 is input "button" with external pull-up wakes from deep sleep on low.
  expected_rules: ["C14"]
  notes: "GPIO 5 is not RTC-capable."

- id: rule-008
  category: rule_violation
  request: "hey so i want the LED on GPIO 1 but i still want to see the serial console for debugging, is that ok? wifi off bt off"
