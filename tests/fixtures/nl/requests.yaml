# Evaluation corpus for the plain-English -> controlled-English translator.
# Phrasings were brainstormed with the local Qwen model (scripts/gen_corpus.py),
# then filtered, rewritten and labelled by hand.

# ---------------------------------------------------------------- clear
- id: clear-001
  category: clear
  request: "There's an LED on GPIO 25 and a push button on GPIO 4 wired to ground, nothing else on the board. Use the chip's internal pull-up for the button, no Wi-Fi or Bluetooth."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 25 is output "led" with no pull.
    gpio 4 is input "button" with internal pull-up.
  notes: "Canonical case; the lead example made explicit about the pull."

- id: clear-002
  category: clear
  request: "esp32 button gpio13 input int pullup, led gpio14 output. no wifi no bt"
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 13 is input "button" with internal pull-up.
    gpio 14 is output "led" with no pull.
  notes: "Terse, abbreviated, 'int pullup'."

- id: clear-003
  category: clear
  request: "hey can u help me with esp32 firmware? i have a relay on D25 (output) and a limit switch on IO26 that goes to ground, enable the internal pullup for it. wifi is off, bluetooth off thx!"
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 25 is output "relay" with no pull.
    gpio 26 is input "limit switch" with internal pull-up.
  notes: "Chatty, mixed pin-name styles (D25 / IO26). Qwen produced this register well."

- id: clear-004
  category: clear
  request: "Pin 32 reads a door sensor that has a 10k resistor on the board pulling it up to 3.3V. Pin 33 drives a buzzer. Wi-Fi and Bluetooth are not used."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 32 is input "door sensor" with external pull-up.
    gpio 33 is output "buzzer" with no pull.
  notes: "'pin N' style; external pull-up stated as a resistor on the board."

- id: clear-005
  category: clear
  request: "I2C temperature sensor on GPIO21 (SDA) and GPIO22 (SCL). The breakout board already has 4.7k pull-ups on both lines. No Wi-Fi, no Bluetooth."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 21 is i2c0 sda with off-board pull-up.
    gpio 22 is i2c0 scl with off-board pull-up.
  notes: "Pull-ups on the sensor breakout map to 'off-board pull-up'."

- id: clear-006
  category: clear
  request: "Hooking up a pot to GPIO34 for analog reading, nothing else, wifi disabled and bluetooth disabled."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 34 is input adc "pot" with no pull.
  notes: "Analog input needs no pull; GPIO34 is ADC1 and input-only so it is valid. Tests that 'no pull' is chosen for ADC, not a question."

- id: clear-007
  category: clear
  request: "gpio27 output for a green led, gpio26 output for a red led, gpio25 output for a blue led. They are all active high with a resistor in series. Nothing else connected, wifi bt off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 27 is output "green led" with no pull.
    gpio 26 is output "red led" with no pull.
    gpio 25 is output "blue led" with no pull.
  notes: "Several outputs; order should follow the request."

- id: clear-008
  category: clear
  request: "I want a panic button on GPIO 14 that wakes the board from deep sleep when pressed. The button goes between the pin and ground and I have a 10k pull-up resistor on the board. Wi-Fi off, Bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    deep sleep is on.
    console is on uart0.
    gpio 14 is input "panic button" with external pull-up wakes from deep sleep on low.
  notes: "Wake level is derived from the wiring (button to ground, pull-up), so no question is needed. GPIO 14 is RTC-capable."

- id: clear-009
  category: clear
  request: "Pls make firmware: button A on gpio 18 (internal pull-up), button B on gpio 19 (internal pull-up), buzzer on gpio 23. Both buttons connect to ground. No radio stuff."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 18 is input "button a" with internal pull-up.
    gpio 19 is input "button b" with internal pull-up.
    gpio 23 is output "buzzer" with no pull.
  notes: "'No radio stuff' means wifi and bluetooth off."

- id: clear-010
  category: clear
  request: "i am make project, esp32. pin 16 is for motor relay, output. pin 17 is switch to ground and i use internal pull up resistor. no wifi, no bluetooth, i not use serial debug."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on nothing.
    gpio 16 is output "motor relay" with no pull.
    gpio 17 is input "switch" with internal pull-up.
  notes: "Non-native English; console explicitly unused. GPIO 16/17 are ordinary GPIOs on WROOM (no PSRAM)."

- id: clear-011
  category: clear
  request: "Wi-Fi connected sensor node: soil moisture probe analog out on GPIO 32, status LED on GPIO 2... actually no, put the LED on GPIO 23. Wi-Fi is on, Bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is on.
    bluetooth is off.
    console is on uart0.
    gpio 32 is input adc "soil moisture" with no pull.
    gpio 23 is output "status led" with no pull.
  notes: "Self-correction mid-sentence (2 -> 23); GPIO 32 is ADC1 so Wi-Fi is fine. A translator that keeps GPIO 2 is wrong."

- id: clear-012
  category: clear
  request: "UART2 to a GPS: its TX goes to GPIO 16 on the ESP and the ESP's TX is GPIO 17. They're plain 3.3V push-pull lines. Wifi and BT off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 16 is uart2 rx with no pull.
    gpio 17 is uart2 tx with no pull.
  notes: "Direction trap: the GPS TX connects to the ESP RX. Tests that signals are mapped by the ESP's side."

- id: clear-013
  category: clear
  request: "button on IO4 to ground w/ internal pullup that triggers an interrupt on press, and an LED on IO25. Wifi off bt off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 4 is input interrupt "button" with internal pull-up.
    gpio 25 is output "led" with no pull.
  notes: "'triggers an interrupt' selects the interrupt function."

- id: clear-014
  category: clear
  request: "Need an SPI display-less sensor: MOSI 23, MISO 19, SCLK 18, CS 5 on SPI2... wait, CS should be 15. Nothing else, no wifi, no bluetooth. Strapping pin levels: GPIO 15 is high at reset since the sensor's CS idles high."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 23 is spi2 mosi with no pull.
    gpio 19 is spi2 miso with no pull.
    gpio 18 is spi2 sclk with no pull.
    gpio 15 is spi2 cs with no pull.
    gpio 15 is high at reset.
  notes: "Self-correction, and a strapping pin whose reset level is stated so W4 stays quiet."

- id: clear-015
  category: clear
  request: "Float switch on GPIO 22 connects to ground when the tank is empty; I put an external 10k pull-up on it. Pump relay on GPIO 21, active high. Wifi and bluetooth are not used and neither is the USB serial console."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on nothing.
    gpio 22 is input "float switch" with external pull-up.
    gpio 21 is output "pump relay" with no pull.
  notes: "Console off is stated, so a clear case."

# ---------------------------------------------------------------- ambiguous
- id: amb-001
  category: ambiguous
  request: "esp32, push button on GPIO 4 and an LED on GPIO 25. Turn the LED on when the button is pressed."
  expected_questions: ["pull for the button", "button active level"]
  notes: "Classic: input with no pull or wiring stated."

- id: amb-002
  category: ambiguous
  request: "firmware for esp32 reading bme280 on the usual i2c pins and printing to serial"
  expected_questions: ["which pins for I2C", "pull-ups for I2C"]
  notes: "'The usual I2C pins' must not be silently resolved to 21/22 without confirming; pull-ups also unstated."

- id: amb-003
  category: ambiguous
  request: "Read a light sensor on analog pin 25 and send the value to my server."
  expected_questions: ["Wi-Fi in use", "ADC2 conflict with Wi-Fi"]
  notes: "Sending to a server implies Wi-Fi, and GPIO 25 is ADC2. The translator must surface the conflict, not choose."

- id: amb-004
  category: ambiguous
  request: "button on d4, led on d5. i dont know if button is active low or high"
  expected_questions: ["button active level", "pull for the button"]
  notes: "The user admits uncertainty. D5 is also a strapping pin with no reset level."

- id: amb-005
  category: ambiguous
  request: "Blink an LED when I press the button."
  expected_questions: ["which pin for the LED", "which pin for the button", "pull for the button"]
  notes: "No pins at all."

- id: amb-006
  category: ambiguous
  request: "hi! i have an esp32 dev kit and want to light a led on pin 25 based on a soil moisture sensor. also added a button but idk if it needs pullup or pulldown, maybe just pullup?"
  expected_questions: ["soil sensor pin", "soil sensor analog or digital", "button pin"]
  notes: "Qwen-style chatty; the sensor and button pin are missing and the pull is a guess."

- id: amb-007
  category: ambiguous
  request: "ESP32 with an OLED on I2C and a temp sensor on I2C too, plus a button that wakes it from sleep."
  expected_questions: ["which pins for I2C", "pull-ups for I2C", "button pin", "pull for the button"]
  notes: "Two I2C devices on one bus; button pin unstated."

- id: amb-008
  category: ambiguous
  request: "I'm reading a battery voltage with an ADC on pin 4 and posting it over wifi. Also a relay on pin 16."
  expected_questions: ["ADC2 conflict with Wi-Fi", "move the ADC pin"]
  notes: "Wi-Fi is stated, so the real question is how to resolve the ADC2 conflict; the translator must not invent a pin."

- id: amb-009
  category: ambiguous
  request: "gpio25 button, io25 led. no resistor info. no wifi"
  expected_questions: ["which pin for the LED or button", "pull for the button"]
  notes: "Two roles on one pin by apparent typo; the translator must ask, not emit two statements."

- id: amb-010
  category: ambiguous
  request: "Door sensor on D14 reports when the door opens. Siren on 27."
  expected_questions: ["pull for the door sensor", "door sensor active level"]
  notes: "Reed switch wiring unstated."

- id: amb-011
  category: ambiguous
  request: "i need esp32 code for led and button and sensor please"
  expected_questions: ["pins for all three", "sensor type and interface", "pull for the button"]
  notes: "Nearly empty request."

- id: amb-012
  category: ambiguous
  request: "Wake the ESP32 from deep sleep with a pushbutton on pin 33, then blink an LED on 25."
  expected_questions: ["pull for the button", "wake level"]
  notes: "Valid RTC pin, but pull and wake level are unknown."

- id: amb-013
  category: ambiguous
  request: "Use the default UART pins for a serial sensor and keep the debug console working."
  expected_questions: ["which UART", "which pins"]
  notes: "'Default pins' are GPIO 1/3 on UART0, which conflict with the console; the translator should ask."

- id: amb-014
  category: ambiguous
  request: "Put a potentiometer on one of the analog pins and an led on a free pin."
  expected_questions: ["which pin for the pot", "which pin for the LED"]
  notes: "'A free pin' is a choice the user must make or confirm."

- id: amb-015
  category: ambiguous
  request: "Two buttons, GPIO 18 and GPIO 19, each toggle a relay on 23 and 21. They're wired between the pin and 3.3V."
  expected_questions: ["pull-down for the buttons"]
  notes: "Wired to 3.3 V means active high but whether a pull-down resistor exists is unstated; the internal pull-down is a choice."

