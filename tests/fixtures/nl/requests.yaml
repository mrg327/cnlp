    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 20 is output "siren relay" with no pull.
  expected_rules: ["C1"]
  notes: "GPIO 20 is not bonded out on the ESP32."

- id: rule-005
  category: rule_violation
  request: "i want to read a battery voltage on analog pin 4 while wifi is on and uploading to my server. bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is on.
    bluetooth is off.
    console is on uart0.
    gpio 4 is input adc "battery" with no pull.
  expected_rules: ["C10"]
