# ---------------------------------------------------------------- state_machine
- id: fsm-001
  category: state_machine
  request: "Button on GPIO 4 (to ground, internal pull-up). Each press starts a measurement. While measuring, read the sensor every 10 seconds; once a read is ok go back to idle, and if 3 reads fail go to an error state. A button press in error goes back to idle. Wi-Fi and Bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 4 is input "button" with internal pull-up.
    machine sensor starts in idle.
    state idle: on button press go to measuring.
    state measuring: every 10 s do read sensor; on read ok go to idle; after 3 read failed go to error.
    state error: on button press go to idle.
  notes: "The fsm_demo example in prose; the machine name is a free choice, graders should not require 'sensor'."

- id: fsm-002
  category: state_machine
  request: "Lamp with an LED on GPIO 25 and a button on GPIO 13 (internal pull-up). It starts off. Press the button to turn it on, press again to turn it off. Radios off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 25 is output "led" with no pull.
    gpio 13 is input "button" with internal pull-up.
    machine lamp starts in off.
    state off: on button press go to lit.
    state lit: on button press go to off.
  notes: "Simplest toggle."

- id: fsm-003
  category: state_machine
  request: "pump on GPIO 21 (relay, output), start button on GPIO 14 with external pull-up. when i press start, it runs; after 30 secs it should stop by itself (timeout). Also press stop = same button to stop earlier. no wifi/bt"
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 21 is output "pump" with no pull.
    gpio 14 is input "start button" with external pull-up.
    machine pump starts in stopped.
    state stopped: on button press go to running.
    state running: on button press go to stopped; on timeout go to stopped.
  notes: "A 30 s timeout cannot be written as 'after 30 s' in this grammar; 'on timeout' is the only expressible form. Acceptable alternatives: an event named after the timeout. Graders should only check structure."

- id: fsm-004
  category: state_machine
  request: "Door alarm: reed switch on GPIO 32 with internal pull-up, siren on GPIO 33. System is disarmed at start. A button on GPIO 14 (external pull-up) arms it. When armed, if the door opens go to alarm. In alarm the siren is on until the button is pressed, which disarms it. No wifi, no bluetooth."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 32 is input "reed switch" with internal pull-up.
    gpio 33 is output "siren" with no pull.
    gpio 14 is input "button" with external pull-up.
    machine alarm starts in disarmed.
    state disarmed: on button press go to armed.
    state armed: on door open go to alarm; on button press go to disarmed.
    state alarm: on button press go to disarmed.
  notes: "Three states, events from two inputs."

- id: fsm-005
  category: state_machine
  request: "esp32, button gpio25 pulled up internally. connect: try; if fails 5 times -> give up and stay in failed. press the button to try again. leds not needed, radios off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 25 is input "button" with internal pull-up.
    machine link starts in connecting.
    state connecting: on connect ok go to connected; after 5 connect failed go to failed.
    state connected.
    state failed: on button press go to connecting.
  notes: "Retry counter ('after 5 ...'); 'connected' has no transitions and is a legitimate final state per the grammar."

- id: fsm-006
  category: state_machine
  request: "Heater relay on GPIO 26. Button on GPIO 4 to ground with the internal pull-up cycles the mode: off, then low, then high, then back to off. In low mode, check the temperature every 5 seconds. Radios off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 26 is output "heater relay" with no pull.
    gpio 4 is input "button" with internal pull-up.
    machine heater starts in off.
    state off: on button press go to low.
    state low: every 5 s do check temperature; on button press go to high.
    state high: on button press go to off.
  notes: "Cycling modes plus a periodic action in one state."

- id: fsm-007
  category: state_machine
  request: "Sleep-based logger: button on GPIO 33 (10k external pull-up) wakes it. After waking it samples the sensor once every 2 seconds; when the sample is done it goes back to sleep. If sampling fails twice, it goes to a fault state until the button is pressed again. Deep sleep is used, wifi and bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    deep sleep is on.
    console is on uart0.
    gpio 33 is input "button" with external pull-up wakes from deep sleep on low.
    machine logger starts in sleeping.
    state sleeping: on button press go to sampling.
    state sampling: every 2 s do take sample; on sample done go to sleeping; after 2 sample failed go to fault.
    state fault: on button press go to sleeping.
  notes: "Combines wake pin with retries and a periodic action."

- id: fsm-008
  category: state_machine
  request: "traffic light: red on 25, yellow on 26, green on 27, all outputs. red for 20 s, then green for 15 s, then yellow for 3 s, then repeat. Wifi and bt off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 25 is output "red" with no pull.
    gpio 26 is output "yellow" with no pull.
    gpio 27 is output "green" with no pull.
    machine light starts in red.
    state red: on red done go to green.
    state green: on green done go to yellow.
    state yellow: on yellow done go to red.
  notes: "The grammar has no 'after N s go to' timeout form, only counted events, so durations (20 s, 15 s, 3 s) cannot be encoded as stated. A faithful translator should either use done-events and ask how the durations are produced, or mention the limitation. Graders should check structure only and expect a question about timing."

- id: fsm-009
  category: state_machine
  request: "Smart plug: relay on GPIO 16, button on GPIO 17 with internal pull-up. Press once: on. Press again: off. If the button is pressed while the relay is on and the load is overheating (overheat event), go to a locked state. Locked clears when the button is pressed. Wifi off, BT off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 16 is output "relay" with no pull.
    gpio 17 is input "button" with internal pull-up.
    machine plug starts in off.
    state off: on button press go to lit.
    state lit: on button press go to off; on overheat go to locked.
    state locked: on button press go to off.
  notes: "Convoluted prose; the named 'overheat event' becomes an event with no pin behind it."

- id: fsm-010
  category: state_machine
  request: "Two-button door opener: open button on GPIO 18, close button on GPIO 19, both to ground with internal pull-ups; motor relay on GPIO 23 for opening and GPIO 22 for closing. Door starts closed. Press open: opening. When the open limit is reached: open. Press close: closing. When the close limit is reached: closed. If the motor is overloaded 3 times while opening, go to blocked. No radios."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 18 is input "open button" with internal pull-up.
    gpio 19 is input "close button" with internal pull-up.
    gpio 23 is output "open relay" with no pull.
    gpio 22 is output "close relay" with no pull.
    machine door starts in closed.
    state closed: on open button press go to opening.
    state opening: on open limit go to open; after 3 overload go to blocked.
    state open: on close button press go to closing.
    state closing: on close limit go to closed.
    state blocked: on close button press go to closing.
  notes: "Long, multi-state; 'blocked' escape is the translator's inference only if stated, here added to avoid a dead end. Graders should check for the stated transitions and not penalise an extra escape from blocked."

# ---------------------------------------------------------------- out_of_scope
- id: oos-001
  category: out_of_scope
  request: "Servo on GPIO 25, set the PWM frequency to 50 Hz and use a 7.5% duty cycle to centre it."
  expected_questions: ["PWM frequency and duty cannot be stated", "pin only: output with pwm function"]
  notes: "The language can say 'gpio 25 is output pwm' but not frequency or duty. The translator must not invent a 50 Hz statement."

- id: oos-002
  category: out_of_scope
  request: "Connect to wifi ssid 'HomeNet' with password 'hunter2' and publish the temperature to mqtt topic home/temp every 5 seconds."
  expected_questions: ["Wi-Fi credentials are out of scope", "MQTT topic is out of scope"]
  notes: "Only 'wifi is on' is expressible. Credentials must never be copied into the spec."

- id: oos-003
  category: out_of_scope
  request: "Drive an SSD1306 OLED on I2C and draw a bitmap at x=10, y=20 with a custom font."
  expected_questions: ["display drawing is out of scope", "I2C pins and pull-ups"]
  notes: "The I2C part is partly expressible but pins are not stated, so a question is also needed."

- id: oos-004
  category: out_of_scope
  request: "calibrate the temperature sensor with temp = (raw - 200) * 0.5 + offset and show it"
  expected_questions: ["calibration maths is out of scope", "sensor type and pin"]
  notes: "Pure application logic; no pin facts at all."

- id: oos-005
  category: out_of_scope
  request: "Make the LED on GPIO 25 fade smoothly at 5 kHz PWM with 12-bit resolution, and log the duty cycle over BLE every second."
  expected_questions: ["PWM frequency and resolution cannot be stated", "BLE logging is out of scope"]
  notes: "Mixed: output with pwm is expressible; frequency, resolution and BLE logging are not."
