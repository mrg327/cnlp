- id: rule-006
  category: rule_violation
  request: "I wired a button to GPIO 12 with an external pull-up resistor to 3.3V; the other side goes to ground. wifi off bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
