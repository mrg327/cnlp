  request: "Drive a relay from GPIO 34. No Wi-Fi, no Bluetooth."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 34 is output "relay" with no pull.
  expected_rules: ["C2"]
  notes: "GPIO 34 is input-only."

- id: rule-002
  category: rule_violation
  request: "Button on pin 35 to ground, turn on the internal pull-up for it. Wifi off, bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 35 is input "button" with internal pull-up.
  expected_rules: ["C2"]
  notes: "GPIO 35 has no pull hardware."

- id: rule-003
  category: rule_violation
  request: "put the status LED on GPIO 7, no wifi, no bluetooth"
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
    board is devkit-v1.
    wifi is off.
    bluetooth is off.
    console is on uart0.
    gpio 7 is output "status led" with no pull.
  expected_rules: ["C3", "W1"]
  notes: "Flash pin. The translator must translate faithfully; the engine rejects."

- id: rule-004
  category: rule_violation
  request: "Siren relay on IO20, wifi and bt off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
