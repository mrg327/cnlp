- id: rule-011
  category: rule_violation
  request: "LED on pin 25 and also the buzzer on pin 25. Wifi off bluetooth off."
  expected_rules: ["OWNER"]
  notes: "Two roles on one pin. The parser itself rejects duplicate pin statements, so there is no expected_spec; the translator should surface the clash rather than emit it silently. Contrast with amb-009, where the clash looks like a typo."

- id: rule-012
  category: rule_violation
  request: "Interrupt on GPIO 36 from a switch with an external pull-up, and a pot on GPIO 39 read with the ADC. Wifi off, bluetooth off."
  expected_spec: |
    chip is esp32.
    module is esp32-wroom-32.
