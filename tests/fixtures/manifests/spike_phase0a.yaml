# Matches what spikes/phase0a configured; pairs with tests/fixtures/readback/spike_phase0a.log
chip: esp32
module: esp32-wroom-32
board: devkit-v1
idf_version: "5.5.6"
features: {wifi: false, bluetooth: false, deep_sleep: false, console: uart0, jtag: false}
pins:
  - {gpio: 25, role: led, mode: output, pull: none, function: gpio}
  - {gpio: 4, role: button, mode: input, pull: internal_up, function: gpio}
state_machines: []
